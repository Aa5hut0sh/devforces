version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: devforces-postgres
    restart: always
    environment:
      POSTGRES_USER: devforces
      POSTGRES_PASSWORD: protagonist
      POSTGRES_DB: devforces
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"  
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devforces"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: devforces-redis
    restart: always
    command: redis-server --maxmemory-policy noeviction --maxmemory 256mb
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data: