name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST}}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            
            # 1. Load NVM so the system knows where Node and PM2 are
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            
            # 2. Load Bun
            export BUN_INSTALL="$HOME/.bun"
            export PATH="$BUN_INSTALL/bin:$PATH"
            
            cd /home/${{ secrets.SERVER_USERNAME }}/devforces
            
            echo "Pulling latest"
            git pull origin main
            
            echo "Installing deps"
            bun install
            
            echo "Running migrations"
            cd packages/database
            bunx --bun prisma migrate deploy
            bunx --bun prisma generate
            cd ../..
            
            echo "Building web"
            cd apps/web
            bun run build
            cd ../..
            
            echo "Reloading nginx if config changed"
            sudo nginx -t && sudo systemctl reload nginx
            
            echo "Restarting services"
            # Now you can just use pm2 normally!
            pm2 restart devforces-api devforces-worker devforces-web
            pm2 save
            
            echo "Deploy complete"