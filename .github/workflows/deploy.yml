name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST}}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            
            export BUN_INSTALL="$HOME/.bun"
            export PATH="$BUN_INSTALL/bin:$HOME/.npm-global/bin:/usr/local/bin:$PATH"
            
            cd /home/${{ secrets.SERVER_USERNAME }}/devforces
            
            echo "Pulling latest"
            git pull origin main
            
            echo "Installing deps"
            bun install
            
            echo "Running migrations"
            cd packages/database
            bunx --bun prisma migrate deploy
            bunx --bun prisma generate
            cd ../..
            
            echo "Building web"
            cd apps/web
            bun run build
            cd ../..
            
            echo "Reloading nginx if config changed"
            sudo nginx -t && sudo systemctl reload nginx
            
            echo "Restarting services"
            /home/${{ secrets.SERVER_USERNAME }}/.nvm/versions/node/v20.20.2/bin/pm2 restart devforces-api devforces-worker devforces-web
            /home/${{ secrets.SERVER_USERNAME }}/.nvm/versions/node/v20.20.2/bin/pm2 save
            
            echo "Deploy complete"